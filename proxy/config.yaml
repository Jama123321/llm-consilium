# Consilium LiteLLM proxy — Phase 0 (Tier-A providers only).
# Secrets are referenced via os.environ/* and loaded from ~/.config/consilium/.env.
# The privacy_tier tags are read by the Phase 1 council privacy gate;
# capabilities/strength are read by the Phase 1 router and council.
model_list:
  # Cerebras free catalog drifted from the 2026 audit (qwen-3-235b / llama-3.3-70b
  # no longer offered); pinned to live ids verified via GET api.cerebras.ai/v1/models.
  # NOTE on tier: privacy_tier follows the INFERENCE PROVIDER (Cerebras: no-train /
  # no-retain ToS), not the weights' origin. zai-glm-4.7 runs on Cerebras, so Zhipu
  # never sees the prompt -> Tier-A. (Tier-B for GLM would apply only to a direct
  # open.bigmodel.cn call.)
  - model_name: council/cerebras-glm-4.7
    litellm_params:
      model: cerebras/zai-glm-4.7
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 5
    model_info:
      privacy_tier: A
      scores: {reasoning: 5, code: 4, general: 4}
      tpd: 1000000
  - model_name: council/cerebras-gpt-oss-120b
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 5
    model_info:
      privacy_tier: A
      scores: {reasoning: 4, code: 4, general: 4}
      tpd: 1000000
  - model_name: council/groq-llama-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
    model_info:
      privacy_tier: A
      scores: {general: 3, fast: 3, code: 3}
      rpd: 1000
  # Groq free tier: does NOT train on prompts (the Tier-A criterion); default keeps
  # 7-day operational logs — full zero-retention needs ZDR (later action, non-blocking).
  - model_name: council/groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
    model_info:
      privacy_tier: A
      scores: {reasoning: 4, code: 4, general: 4, fast: 4}
      rpd: 1000
  - model_name: council/cloudflare-llama-70b
    litellm_params:
      model: openai/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_TOKEN
    model_info:
      privacy_tier: A
      scores: {general: 3, fast: 3}
      tpd: 10000
  # --- Phase 2c additions. Model IDs provisional; validated live in Task 9. ---
  # GitHub Models — documented no-train => Tier A (GPT-class safe tier win).
  - model_name: council/github-gpt-4.1
    litellm_params:
      model: github/gpt-4.1
      api_key: os.environ/GITHUB_API_KEY
      rpm: 10
    model_info:
      privacy_tier: A
      scores: {general: 5, code: 5, reasoning: 4}
      rpd: 50
  - model_name: council/github-o4-mini
    litellm_params:
      model: github/o4-mini
      api_key: os.environ/GITHUB_API_KEY
      rpm: 10
    model_info:
      privacy_tier: A
      scores: {reasoning: 5, fast: 4, code: 4, general: 3}
      rpd: 50
  # Tier B — free tier trains/retains or undocumented => public prompts only.
  - model_name: council/mistral-large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 6
    model_info:
      privacy_tier: B
      scores: {reasoning: 4, general: 4, code: 3}
  - model_name: council/mistral-codestral
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 6
    model_info:
      privacy_tier: B
      scores: {code: 5, fast: 4, general: 3}
  - model_name: council/sambanova-llama-405b
    litellm_params:
      model: sambanova/Meta-Llama-3.1-405B-Instruct
      api_key: os.environ/SAMBANOVA_API_KEY
      rpm: 10
    model_info:
      privacy_tier: B
      scores: {reasoning: 4, general: 4, code: 3}
  - model_name: council/sambanova-llama-70b
    litellm_params:
      model: sambanova/Meta-Llama-3.3-70B-Instruct
      api_key: os.environ/SAMBANOVA_API_KEY
      rpm: 10
    model_info:
      privacy_tier: B
      scores: {fast: 5, general: 3, code: 3}
  # NVIDIA NIM — no key this phase; key-presence activation keeps these dormant.
  - model_name: council/nvidia-deepseek-r1
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-r1
      api_key: os.environ/NVIDIA_NIM_API_KEY
      rpm: 10
    model_info:
      privacy_tier: B
      scores: {reasoning: 5, general: 3}
  - model_name: council/nvidia-llama-70b
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_NIM_API_KEY
      rpm: 10
    model_info:
      privacy_tier: B
      scores: {general: 3, code: 3, fast: 4}
router_settings:
  num_retries: 1
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
